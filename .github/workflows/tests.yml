name: tests
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build123d trimesh rtree networkx lxml scipy shapely numpy matplotlib pillow
      - name: smoke test
        run: |
          set -o pipefail
          CADPY="$(which python)" ./smoke_test.sh 2>&1 | tee out.txt || {
            tail -n 10 out.txt | while IFS= read -r l; do echo "::error::${l}"; done
            exit 1; }
