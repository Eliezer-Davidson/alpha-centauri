name: tests
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build123d trimesh rtree numpy matplotlib pillow
      - run: CADPY=python ./smoke_test.sh
